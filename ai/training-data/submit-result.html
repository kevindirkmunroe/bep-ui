<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        /* This class hides the thank you message initially */
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2><a href="http://localhost:8000/fakecheapsf-original.htm">FakecheapSF</a></h2><br/>
    <h3>Thank You!</h3>

    <!-- The Form Container -->
    <div id="formContainer">
	<strong>Your Event has been Published at</strong> <a href="http://localhost:8000/fakecheapsf-event.html">http://localhost:8000/fakecheapsf-event.html</a>
        <h2>Contact Us</h2>
        <form id="myForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- The Thank You Message (Hidden by default) -->
    <div id="thankYouMessage" class="hidden">
        <h2>Thank You!</h2>
        <p>Your submission has been received successfully.</p>
    </div>

    <script>
        document.getElementById('myForm').addEventListener('submit', function(event) {
            // Prevent the default browser page reload
            event.preventDefault();

            // Hide the form and show the thank you message
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('thankYouMessage').classList.remove('hidden');
        });
    </script>

</body>
</html>
